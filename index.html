<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강원음악연구소 | Gangwon Institute of Music</title>
  
  <!-- 웹 폰트 (Pretendard & Noto Serif KR) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #fbfbf9;
      --bg-surface: #ffffff;
      --border-subtle: #eae8e1;
      --border-line: #dcd8ce;
      --text-main: #1d1d1f;
      --text-body: #4a4a4f;
      --text-muted: #86868b;
      --accent: #8c7355;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-body);
      line-height: 1.8;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
    }

    .serif {
      font-family: 'Noto Serif KR', serif;
    }

    /* 상단 네비게이션 헤더 */
    header {
      position: sticky;
      top: 0;
      background: rgba(251, 251, 249, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 50;
      padding: 1.25rem 2rem;
    }
    .header-inner {
      max-width: 1140px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-logo {
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
    }
    .brand-logo .title {
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .brand-logo .eng {
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 2px;
      font-weight: 400;
    }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-left: 2rem;
      transition: color 0.2s ease;
    }
    nav a:hover {
      color: var(--text-main);
    }

    /* 컨테이너 */
    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 5rem 2rem 6rem;
    }

    /* 히어로 섹션 */
    .hero {
      text-align: center;
      padding: 7rem 1rem 5.5rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .hero-label {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 1.75rem;
      display: inline-block;
    }
    .hero h1 {
      font-size: clamp(2.1rem, 4.2vw, 3.1rem);
      font-weight: 400;
      color: var(--text-main);
      line-height: 1.4;
      margin-bottom: 1.75rem;
      word-break: keep-all;
    }
    .hero p.lead {
      font-size: 1.12rem;
      color: var(--text-body);
      max-width: 720px;
      margin: 0 auto;
      font-weight: 300;
      line-height: 1.9;
      word-break: keep-all;
    }

    /* 섹션 제목 공통 */
    .section-header {
      margin-bottom: 3.5rem;
    }
    .section-num {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.6rem;
    }
    .section-title {
      font-size: 1.85rem;
      color: var(--text-main);
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    /* 인사말 섹션 */
    .message-layout {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 4.5rem 4rem;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.02);
    }
    .quote-box {
      font-size: 1.35rem;
      line-height: 1.65;
      color: var(--accent);
      margin-bottom: 2rem;
      font-weight: 400;
      word-break: keep-all;
    }
    .message-body p {
      font-size: 1.05rem;
      color: var(--text-body);
      margin-bottom: 1.5rem;
      line-height: 1.95;
      word-break: keep-all;
    }
    .sign-box {
      margin-top: 3.5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 1rem;
    }
    .sign-box .role {
      font-size: 0.95rem;
      color: var(--text-muted);
    }
    .sign-box .name {
      font-size: 1.3rem;
      color: var(--text-main);
      font-weight: 500;
      letter-spacing: 0.1em;
    }

    /* 4대 활동 그리드 */
    .activities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 2rem;
      margin-top: 5rem;
    }
    .activity-card {
      border-top: 1px solid var(--text-main);
      padding-top: 1.5rem;
    }
    .activity-card h3 {
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 0.75rem;
      font-weight: 500;
    }
    .activity-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.7;
      word-break: keep-all;
    }

    /* 아티스트 갤러리 섹션 */
    .artists-section {
      margin-top: 8rem;
    }
    .artists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }
    .artist-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .artist-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.05);
    }
    .artist-img-wrapper {
      width: 100%;
      aspect-ratio: 3 / 4;
      background-color: #f3f1ea;
      overflow: hidden;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }
    .artist-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.35s ease;
    }
    
    /* 인물별 세부 구도 중심점 보정 */
    .artist-img-wrapper img.crop-director {
      object-position: center 15% !important;
    }
    .artist-img-wrapper img.crop-artist-04 {
      object-position: 45% 30% !important;
    }
    .artist-img-wrapper img.crop-artist-05 {
      object-position: center 25% !important;
    }
    .artist-img-wrapper img.crop-artist-06 {
      object-position: center 20% !important;
    }
    .artist-img-wrapper img.crop-artist-08 {
      object-position: center 15% !important;
    }
    .artist-img-wrapper img.crop-artist-10 {
      object-position: center 15% !important;
    }

    .artist-card:hover .artist-img-wrapper img {
      transform: scale(1.02);
    }
    .artist-info {
      padding: 1.75rem 1.6rem 2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .artist-role {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.35rem;
      font-weight: 500;
    }
    .artist-name {
      font-size: 1.35rem;
      color: var(--text-main);
      margin-bottom: 1rem;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .artist-bio-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.86rem;
      color: #55555a;
      line-height: 1.65;
    }
    .artist-bio-list li {
      position: relative;
      padding-left: 0.9rem;
      margin-bottom: 0.35rem;
      word-break: keep-all;
    }
    .artist-bio-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent);
      font-size: 0.8rem;
    }
    .artist-bio-list li.current-role {
      margin-top: 0.75rem;
      padding-top: 0.6rem;
      border-top: 1px dashed var(--border-subtle);
      color: var(--text-main);
      font-weight: 500;
    }

    /* 푸터 */
    footer {
      border-top: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      padding: 4rem 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    footer p { margin-bottom: 0.4rem; }

    @media (max-width: 768px) {
      .message-layout { padding: 2.5rem 1.75rem; }
      .container { padding: 3.5rem 1.25rem 5rem; }
      .hero { padding: 5rem 1rem 4rem; }
      .artists-grid { grid-template-columns: 1fr; }
      nav { display: none; }
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="header-inner">
      <a href="#" class="brand-logo">
        <span class="title serif">강원음악연구소</span>
        <span class="eng">Gangwon Institute of Music</span>
      </a>
      <nav>
        <a href="#about">소개 & 인사말</a>
        <a href="#activities">연구 및 활동</a>
        <a href="#artists">아티스트</a>
      </nav>
    </div>
  </header>

  <!-- 히어로 섹션 -->
  <section class="hero">
    <span class="hero-label">Since 2021 · Gangwon Institute of Music</span>
    <h1 class="serif">음악의 깊이를 탐구하고,<br>새로운 레퍼토리로 시대를 잇다</h1>
    <p class="lead">
      강원도를 중심으로 국내외 무대에서 활약하는 음악인들이 모여<br>
      고음악의 문헌적 가치부터 현대 융합 예술
